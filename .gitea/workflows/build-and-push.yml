name: Build and Publish OCI Container with Docker
on:
  push:
    branches: ['main', 'master', 'test']
jobs:
  build-and-push:
    runs-on: debian-12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: ./Containerfile
          tags: |
            ${{ github.event.repository.name }}:latest
            ${{ github.event.repository.name }}:${{ github.sha }}
          load: true
          
      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ github.server_url }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          
      - name: Push to registry
        run: |
          docker push ${{ github.server_url }}/${{ github.event.repository.name }}:latest
          docker push ${{ github.server_url }}/${{ github.event.repository.name }}:${{ github.sha }}
