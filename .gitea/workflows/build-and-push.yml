name: Build and Publish OCI Container with Podman

on:
  push:
    branches: ['main', 'master', 'test']

jobs:
  build-and-push:
    runs-on: debian-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          apt-get update
          apt-get -y install podman

      - name: Set up containers.conf for rootless Podman (optional but recommended)
        run: |
          mkdir -p $HOME/.config/containers
          echo -e "[engine]\nrootless=true" > $HOME/.config/containers/containers.conf

      - name: Log in to Gitea Container Registry
        run: |
          podman login "192.168.41.9" \
            --username "${{ secrets.PACKAGE_REGISTRY_USERNAME }}" \
            --password-stdin \
            <<< "${{ secrets.PACKAGE_REGISTRY_TOKEN }}"

      - name: Build OCI Image
        run: |
          podman build -t ${{ env.IMAGE_NAME }}:latest -f ./Containerfile .
        env:
          IMAGE_NAME: gitea.local.wolfbox.dev/${{ github.repository }}

      - name: Push Image to Gitea Registry
        run: |
          podman push ${{ env.IMAGE_NAME }}:latest
        env:
          IMAGE_NAME: gitea.local.wolfbox.dev/${{ github.repository }}


