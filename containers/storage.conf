# Forces the vfs storage driver for nested/rootless-friendly Podman builds.
# vfs needs no overlay/fuse mounts, so it works inside an already-unprivileged
# container without --privileged or extra host capabilities. Mirrors the
# Gitea CI runner's configuration in .gitea/workflows/build-and-push.yml.
[storage]
driver = "vfs"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

# Nested container has a single UID mapping (no /etc/subuid ranges), so layer
# extraction cannot chown to high UIDs. Ignore those errors.
[storage.options.vfs]
ignore_chown_errors = "true"

